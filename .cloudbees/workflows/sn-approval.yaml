
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: SN-approval
on:
  workflow_dispatch:
  workflow_call:
jobs:
  create-approve-servicenow-job:
    # 60 min approval poll + time for the create/update/close steps
    timeout-minutes: 90
    steps:
      - id: create-cr
        name: Trigger Servicenow Create
        uses: cloudbees-io/servicenow@v1
        with:
          url: ${{ vars.SERVICENOW_URL }}
          username: ${{ secrets.SERVICENOW_USERNAME }}
          password: ${{ secrets.SERVICENOW_PASSWORD }}
          action-type: create
          short-description: Production request - Testing
 
      # Moving to Assess requests approval in ServiceNow.
      # Assess -> Authorize -> Scheduled is driven by ServiceNow approvals,
      # not by the workflow (the state model blocks setting those by API).
      - id: update-cr-assess
        name: Trigger Servicenow Update Assess state
        uses: cloudbees-io/servicenow@v1
        with:
          url: ${{ vars.SERVICENOW_URL }}
          username: ${{ secrets.SERVICENOW_USERNAME }}
          password: ${{ secrets.SERVICENOW_PASSWORD }}
          action-type: update
          sys-id: ${{ fromJSON(steps.create-cr.outputs.servicenow-output).sys_id }}
          state: Assess
          assignment-group: Change Management
 
      # Polls every 3 min for up to 60 min (20 checks) until the change
      # request's approval field is Approved (or Rejected).
      - id: wait-for-approval
        name: Trigger Servicenow Wait For Approval
        uses: cloudbees-io/servicenow-poll-for-approval@v1
        with:
          url: ${{ vars.SERVICENOW_URL }}
          username: ${{ secrets.SERVICENOW_USERNAME }}
          password: ${{ secrets.SERVICENOW_PASSWORD }}
          cr-number: ${{ fromJSON(steps.create-cr.outputs.servicenow-output).number }}
          poll-interval: 3
          poll-duration: 60
          approval-field-value-approved: Approved
          approval-field-value-rejected: Rejected
 
      # After approval ServiceNow moves the CR to Scheduled; the remaining
      # transitions can be set by the workflow.
      - id: update-cr-implement
        name: Trigger Servicenow Update Implement state
        uses: cloudbees-io/servicenow@v1
        with:
          url: ${{ vars.SERVICENOW_URL }}
          username: ${{ secrets.SERVICENOW_USERNAME }}
          password: ${{ secrets.SERVICENOW_PASSWORD }}
          action-type: update
          sys-id: ${{ fromJSON(steps.create-cr.outputs.servicenow-output).sys_id }}
          state: Implement
 
      - id: update-cr-review
        name: Trigger Servicenow Update Review state
        uses: cloudbees-io/servicenow@v1
        with:
          url: ${{ vars.SERVICENOW_URL }}
          username: ${{ secrets.SERVICENOW_USERNAME }}
          password: ${{ secrets.SERVICENOW_PASSWORD }}
          action-type: update
          sys-id: ${{ fromJSON(steps.create-cr.outputs.servicenow-output).sys_id }}
          state: Review
 
      - id: close-cr
        name: Trigger Servicenow Update Closed state
        uses: cloudbees-io/servicenow@v1
        with:
          url: ${{ vars.SERVICENOW_URL }}
          username: ${{ secrets.SERVICENOW_USERNAME }}
          password: ${{ secrets.SERVICENOW_PASSWORD }}
          action-type: update
          sys-id: ${{ fromJSON(steps.create-cr.outputs.servicenow-output).sys_id }}
          short-description: Production request
          state: Closed
          close-code: Successful
          close-notes: Successfully completed
